name: 打印飞书配置

on:
  workflow_dispatch:

jobs:
  print-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成飞书链接文件
        env:
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          echo "飞书多维表格链接" > feishu_link.txt
          echo "====================" >> feishu_link.txt
          echo "https://bytedance.feishu.cn/base/${FEISHU_APP_TOKEN}?table=${FEISHU_TABLE_ID}" >> feishu_link.txt
          echo "https://www.feishu.cn/base/${FEISHU_APP_TOKEN}?table=${FEISHU_TABLE_ID}" >> feishu_link.txt
          echo "====================" >> feishu_link.txt
          echo "表格名称: 数据表" >> feishu_link.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feishu-link
          path: feishu_link.txt
